name: Phase 2.3 Inventory Audit

on:
  push:
    branches:
      - feature/phase2-3-data-completion

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List inventory-only projects
        run: |
          python3 - <<'PY'
          import json
          projects = json.load(open('public/data/projects.json', encoding='utf-8'))['projects']
          enrichment = json.load(open('public/data/enrichment.json', encoding='utf-8'))['records']
          def nonempty(r):
              return any(r.get(k) for k in ('annualBudgetHistory','cumulativeInvestmentHistory','benefitCostHistory','documentedReasons'))
          enriched = {r['projectId'] for r in enrichment if nonempty(r)}
          def has_snapshot(p):
              return any(p.get(k) is not None for k in ('totalProjectCostMillionYen','plannedCompletionFiscalYear','progressPercent','startFiscalYear','benefitCostRatio')) or any(p.get(k) for k in ('costHistory','scheduleHistory','progressHistory'))
          ids = [p['id'] for p in projects if p['id'] not in enriched and not has_snapshot(p)]
          print('INVENTORY_COUNT', len(ids))
          for pid in ids:
              p = next(x for x in projects if x['id']==pid)
              print(f"{pid}\t{p['name']}\t{','.join(p['municipalities'])}")
          PY
