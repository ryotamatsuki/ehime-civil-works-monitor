name: Phase 2.3 Apply Data Completion

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase2-3-data-completion
    paths:
      - scripts/phase23_complete.py
      - .github/workflows/phase23-apply.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-3-data-completion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - name: Apply Phase 2.3 data
        run: python3 scripts/phase23_complete.py
      - name: Validate migrated data
        run: |
          npm run lint
          npm test
          npm run validate
          python3 scripts/report_inventory.py
          npm run build
      - name: Commit canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/projects.json public/data/enrichment.json
          if git diff --cached --quiet; then
            echo "No canonical data changes"
          else
            git commit -m "data: complete Phase 2.3 project snapshots"
            git push origin HEAD:feature/phase2-3-data-completion
          fi
