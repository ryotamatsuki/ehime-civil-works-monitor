name: Apply Archive Data Migration

on:
  push:
    branches:
      - feature/phase2-1-data-enrichment

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[archive-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-1-data-enrichment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python scripts/archive_data_migration.py
      - name: Validate migrated data
        run: |
          python scripts/validate_data.py
          python scripts/validate_enrichment.py
      - name: Commit migrated canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/projects.json public/data/projects.geojson public/data/enrichment.json
          git rm scripts/archive_data_migration.py .github/workflows/archive-data-migration.yml
          git commit -m "data: add FY2024 archive projects [archive-migration]"
          git push origin HEAD:feature/phase2-1-data-enrichment
