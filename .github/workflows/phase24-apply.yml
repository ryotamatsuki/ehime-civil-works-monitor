name: Phase 2.4 Apply Visual Redesign

on:
  push:
    branches:
      - feature/phase2-4-visual-ux-redesign
    paths:
      - scripts/phase24_redesign.py
      - .github/workflows/phase24-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-4-visual-ux-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/phase24_redesign.py
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Commit redesigned app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          if git diff --cached --quiet; then
            echo "No main.ts changes"
          else
            git commit -m "design: implement Phase 2.4 map-first UX"
            git push origin HEAD:feature/phase2-4-visual-ux-redesign
          fi
