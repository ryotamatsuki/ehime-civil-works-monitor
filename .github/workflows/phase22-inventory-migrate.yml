name: Phase 2.2 Migration Cleanup

on:
  push:
    branches: [feature/phase2-2-project-inventory]
    paths:
      - .github/workflows/phase22-inventory-migrate.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-2-project-inventory
      - name: Tighten schema and remove one-shot migration artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_data.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'SCHEMAS = {"2.0.0", "2.2.0"}  # 2.0 accepted only during the Phase 2.2 branch migration.',
              'SCHEMAS = {"2.2.0"}',
          )
          text = text.replace(
              'schemaVersion must be 2.0.0 or 2.2.0 during Phase 2.2 migration',
              'schemaVersion must be 2.2.0 for Phase 2.2',
          )
          path.write_text(text, encoding='utf-8')
          PY
          rm -f scripts/phase22_inventory_migrate.py
          rm -f .github/workflows/phase22-inventory-migrate.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/validate_data.py scripts/phase22_inventory_migrate.py .github/workflows/phase22-inventory-migrate.yml
          git commit -m "chore: remove Phase 2.2 migration artifacts"
          git push origin HEAD:feature/phase2-2-project-inventory
